<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mclone Asset Lab Video</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, sans-serif;
        background: #e7edf2;
        color: #17202a;
      }

      html,
      body {
        margin: 0;
        min-width: 1280px;
        background: #e7edf2;
      }

      #video {
        box-sizing: border-box;
        width: 1280px;
        height: 720px;
        padding: 18px;
      }

      .title {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        height: 28px;
        margin-bottom: 12px;
      }

      .title h1 {
        margin: 0;
        font-size: 22px;
        font-weight: 700;
      }

      .title span {
        color: #475569;
        font-size: 13px;
      }

      .views {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        height: 644px;
      }

      .cell {
        position: relative;
        overflow: hidden;
        border: 1px solid #bac6d1;
        background: #edf1f4;
      }

      .viewport {
        width: 100%;
        height: 100%;
      }

      .label {
        position: absolute;
        left: 8px;
        top: 8px;
        padding: 3px 6px;
        background: rgba(255, 255, 255, 0.82);
        color: #17202a;
        font-size: 12px;
        font-weight: 650;
      }

      .error {
        box-sizing: border-box;
        max-width: 960px;
        margin: 24px;
        padding: 16px;
        border: 1px solid #b93636;
        background: #fff7f7;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <main id="video"></main>
    <script type="module" src="/src/video-page.ts"></script>
  </body>
</html>
