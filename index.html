<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>mclone</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #151712;
        --panel: rgba(24, 26, 21, 0.88);
        --panel-border: rgba(236, 231, 218, 0.18);
        --text: #f1ede3;
        --muted: #b8b2a4;
        --accent: #8fc46b;
        --accent-strong: #b9df73;
        --stone: #7e8581;
        --soil: #7a5033;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        min-height: 100vh;
        min-height: 100dvh;
        overflow: hidden;
      }

      button,
      input {
        font: inherit;
      }

      .start-shell {
        position: relative;
        display: grid;
        min-height: 100vh;
        min-height: 100dvh;
        place-items: center;
        padding: 28px;
        isolation: isolate;
      }

      .world-preview {
        position: absolute;
        inset: 0;
        overflow: hidden;
        z-index: -1;
        background:
          linear-gradient(#82b4d6 0 42%, #c7d7dd 42% 43%, transparent 43%),
          linear-gradient(180deg, rgba(255, 255, 255, 0.12), transparent 36%),
          #151712;
      }

      .sun {
        position: absolute;
        top: 10vh;
        right: 18vw;
        width: 82px;
        height: 82px;
        background: #f1d46a;
        box-shadow: 0 0 36px rgba(241, 212, 106, 0.42);
      }

      .terrain {
        position: absolute;
        left: 50%;
        bottom: 0;
        width: min(1120px, 140vw);
        height: 43vh;
        transform: translateX(-50%);
        image-rendering: pixelated;
      }

      .terrain-row {
        position: absolute;
        left: 0;
        right: 0;
        display: grid;
        grid-template-columns: repeat(28, 1fr);
      }

      .terrain-row span {
        min-height: 6vh;
        border: 1px solid rgba(0, 0, 0, 0.08);
      }

      .grass {
        bottom: 24vh;
      }

      .grass span {
        background: var(--accent);
      }

      .grass span:nth-child(4n),
      .grass span:nth-child(7n) {
        transform: translateY(-3vh);
        background: var(--accent-strong);
      }

      .dirt {
        bottom: 12vh;
      }

      .dirt span {
        background: var(--soil);
      }

      .stone {
        bottom: 0;
      }

      .stone span {
        min-height: 12vh;
        background: var(--stone);
      }

      .menu {
        width: min(430px, calc(100vw - 32px));
        padding: 24px;
        background: var(--panel);
        border: 1px solid var(--panel-border);
        border-radius: 8px;
        box-shadow: 0 18px 60px rgba(0, 0, 0, 0.35);
        backdrop-filter: blur(12px);
      }

      h1 {
        margin: 0 0 20px;
        font-size: 38px;
        line-height: 1;
        font-weight: 750;
      }

      .field {
        display: grid;
        gap: 7px;
        margin-bottom: 14px;
      }

      label,
      .field-title {
        color: var(--muted);
        font-size: 13px;
        font-weight: 650;
      }

      input[type="text"] {
        width: 100%;
        height: 42px;
        border: 1px solid rgba(236, 231, 218, 0.24);
        border-radius: 6px;
        background: rgba(0, 0, 0, 0.22);
        color: var(--text);
        padding: 0 12px;
      }

      input[type="text"]:focus {
        outline: 2px solid rgba(185, 223, 115, 0.42);
        outline-offset: 2px;
      }

      .segmented {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 2px;
        padding: 2px;
        border: 1px solid rgba(236, 231, 218, 0.2);
        border-radius: 6px;
        background: rgba(0, 0, 0, 0.22);
      }

      .segmented input {
        position: absolute;
        opacity: 0;
        pointer-events: none;
      }

      .segmented label {
        display: grid;
        min-height: 36px;
        place-items: center;
        border-radius: 4px;
        color: var(--text);
        cursor: pointer;
      }

      .segmented input:checked + label {
        background: rgba(143, 196, 107, 0.24);
        color: #f8ffe8;
      }

      .actions {
        display: grid;
        gap: 10px;
        margin-top: 18px;
      }

      button,
      .link-button {
        display: grid;
        min-height: 42px;
        place-items: center;
        border: 1px solid rgba(236, 231, 218, 0.24);
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.08);
        color: var(--text);
        text-decoration: none;
        cursor: pointer;
      }

      button.primary {
        border-color: rgba(185, 223, 115, 0.58);
        background: rgba(143, 196, 107, 0.26);
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.42;
      }

      .links {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        margin-top: 16px;
        color: var(--muted);
        font-size: 13px;
      }

      .links a {
        color: var(--muted);
      }

      .status {
        min-height: 18px;
        margin-top: 10px;
        color: var(--muted);
        font-size: 12px;
      }

      @media (max-width: 520px) {
        .start-shell {
          align-items: end;
          padding: 16px;
        }

        .menu {
          width: 100%;
          padding: 18px;
        }

        h1 {
          font-size: 32px;
        }
      }
    </style>
  </head>
  <body>
    <main class="start-shell">
      <div class="world-preview" aria-hidden="true">
        <div class="sun"></div>
        <div class="terrain">
          <div class="terrain-row grass">
            <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
          </div>
          <div class="terrain-row dirt">
            <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
          </div>
          <div class="terrain-row stone">
            <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
          </div>
        </div>
      </div>
      <section class="menu" aria-labelledby="start-title">
        <h1 id="start-title">mclone</h1>
        <form id="start-form">
          <div class="field">
            <label for="seed">Seed</label>
            <input id="seed" name="seed" type="text" inputmode="numeric" autocomplete="off" value="12345" />
          </div>
          <div class="field">
            <div class="field-title">Movement Mode</div>
            <div class="segmented">
              <input id="mode-player" type="radio" name="movementMode" value="player" checked />
              <label for="mode-player">Player</label>
              <input id="mode-freecam" type="radio" name="movementMode" value="freecam" />
              <label for="mode-freecam">Free Cam</label>
            </div>
          </div>
          <div class="actions">
            <button class="primary" type="submit">Start World</button>
            <button id="continue" type="button">Continue</button>
            <button id="quickstart" type="button">Quick Start 12345</button>
          </div>
          <div id="status" class="status"></div>
        </form>
        <nav class="links" aria-label="Developer links">
          <a href="/debug.html">Debug shell</a>
          <a href="/smoke.html">Smoke harness</a>
        </nav>
      </section>
    </main>
    <script>
      const DEFAULT_SEED = "12345";
      const DEFAULT_MOVEMENT_MODE = "player";
      const LAST_WORLD_KEY = "mclone.start.lastWorld.v1";
      const DEBUG_SESSION_CONFIG_KEY = "mclone.debug.sessionConfig.v1";
      const PASSTHROUGH_QUERY_KEYS = [
        "viewDistance",
        "renderDistance",
        "lightingMode",
        "liquidSimulationMode",
        "worldStorageMode",
        "disableLighting",
        "disableWaterSim",
        "disableIndexedDb",
        "fogColor",
        "clearColorScale",
        "worldTransport",
        "worldHostUrl",
        "cameraX",
        "cameraY",
        "cameraZ",
        "cameraYaw",
        "cameraPitch",
        "preserveInitialCamera",
        "clearWorldStorage",
      ];

      const seedInput = document.querySelector("#seed");
      const startForm = document.querySelector("#start-form");
      const continueButton = document.querySelector("#continue");
      const quickstartButton = document.querySelector("#quickstart");
      const statusElement = document.querySelector("#status");

      function normalizeSeed(value) {
        const trimmed = String(value ?? "").trim();
        if (trimmed.length === 0) {
          return DEFAULT_SEED;
        }

        try {
          return BigInt(trimmed).toString();
        } catch {
          return DEFAULT_SEED;
        }
      }

      function normalizeMovementMode(value) {
        return value === "freecam" ? "freecam" : DEFAULT_MOVEMENT_MODE;
      }

      function selectedMovementMode() {
        const checked = document.querySelector("input[name='movementMode']:checked");
        return normalizeMovementMode(checked?.value);
      }

      function setMovementMode(mode) {
        const input = document.querySelector(`#mode-${normalizeMovementMode(mode)}`);
        if (input) {
          input.checked = true;
        }
      }

      function readJsonStorage(key) {
        try {
          const raw = window.localStorage.getItem(key);
          return raw === null ? undefined : JSON.parse(raw);
        } catch {
          return undefined;
        }
      }

      function readLastWorld() {
        const last = readJsonStorage(LAST_WORLD_KEY);
        if (last && typeof last.seed === "string") {
          return {
            seed: normalizeSeed(last.seed),
            movementMode: normalizeMovementMode(last.movementMode),
          };
        }

        const session = readJsonStorage(DEBUG_SESSION_CONFIG_KEY);
        if (session && typeof session.seed === "string") {
          return {
            seed: normalizeSeed(session.seed),
            movementMode: normalizeMovementMode(session.movementMode),
          };
        }

        return undefined;
      }

      function rememberWorld(seed, movementMode) {
        const record = {
          seed: normalizeSeed(seed),
          movementMode: normalizeMovementMode(movementMode),
          lastOpenedAtMs: Date.now(),
        };
        window.localStorage.setItem(LAST_WORLD_KEY, JSON.stringify(record));
        window.localStorage.setItem(DEBUG_SESSION_CONFIG_KEY, JSON.stringify({
          seed: record.seed,
          movementMode: record.movementMode,
        }));
      }

      function buildDebugUrl(seed, movementMode) {
        const current = new URL(window.location.href);
        const target = new URL("/debug.html", window.location.origin);
        target.searchParams.set("seed", normalizeSeed(seed));
        target.searchParams.set("movementMode", normalizeMovementMode(movementMode));
        target.searchParams.set("preset", "default");
        for (const key of PASSTHROUGH_QUERY_KEYS) {
          const value = current.searchParams.get(key);
          if (value !== null && !target.searchParams.has(key)) {
            target.searchParams.set(key, value);
          }
        }

        return `${target.pathname}${target.search}${target.hash}`;
      }

      function openWorld(seed, movementMode, replace) {
        const normalizedSeed = normalizeSeed(seed);
        const normalizedMode = normalizeMovementMode(movementMode);
        rememberWorld(normalizedSeed, normalizedMode);
        const href = buildDebugUrl(normalizedSeed, normalizedMode);
        if (replace) {
          window.location.replace(href);
        } else {
          window.location.href = href;
        }
      }

      function configureFromUrl() {
        const url = new URL(window.location.href);
        const seed = normalizeSeed(url.searchParams.get("seed") ?? DEFAULT_SEED);
        const movementMode = normalizeMovementMode(url.searchParams.get("movementMode"));
        seedInput.value = seed;
        setMovementMode(movementMode);
        const quickstart = url.searchParams.get("quickstart") === "1"
          || url.searchParams.get("quickStart") === "1"
          || url.searchParams.get("autoJoin") === "1";
        if (quickstart) {
          openWorld(seed, movementMode, true);
        }
      }

      function configureContinue() {
        const lastWorld = readLastWorld();
        if (lastWorld === undefined) {
          continueButton.disabled = true;
          statusElement.textContent = "No previous world recorded in this browser.";
          return;
        }

        continueButton.disabled = false;
        statusElement.textContent = `Previous world seed ${lastWorld.seed}.`;
        continueButton.addEventListener("click", () => {
          openWorld(lastWorld.seed, lastWorld.movementMode, false);
        });
      }

      configureFromUrl();
      configureContinue();

      startForm.addEventListener("submit", (event) => {
        event.preventDefault();
        openWorld(seedInput.value, selectedMovementMode(), false);
      });
      quickstartButton.addEventListener("click", () => {
        openWorld(DEFAULT_SEED, DEFAULT_MOVEMENT_MODE, false);
      });
    </script>
  </body>
</html>
