[workspace]
members = [
  "crates/mclone-audio",
  "crates/mclone-assets",
  "crates/mclone-app-runtime",
  "crates/mclone-blocks",
  "crates/mclone-client",
  "crates/mclone-core",
  "crates/mclone-diagnostics",
  "crates/mclone-input",
  "crates/mclone-light",
  "crates/mclone-mesh",
  "crates/mclone-net",
  "crates/mclone-path",
  "crates/mclone-physics",
  "crates/mclone-protocol",
  "crates/mclone-render",
  "crates/mclone-render-session",
  "crates/mclone-server",
  "crates/mclone-ui",
  "crates/mclone-worldgen",
  "crates/mclone-xr-graphics",
  "crates/mclone-xr-host",
  "crates/mclone-xr-scene",
  "apps/mclone-dedicated-server",
  "apps/mclone-android-client",
  "apps/mclone-android-xr-client",
  "apps/mclone-native-client",
  "apps/mclone-web-client",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.92"
publish = false

[workspace.dependencies]
android-activity = { version = "=0.6.0", features = ["native-activity"] }
anyhow = "1"
ash = "0.38"
cpal = "0.18"
env_logger = "0.11"
crc32fast = "1"
flate2 = "1"
glam = "0.30"
image = { version = "0.25", default-features = false, features = ["png"] }
jni = "0.22"
js-sys = "0.3.102"
lewton = "0.10"
libc = "0.2"
libloading = "0.8"
log = "0.4"
mclone-audio = { path = "crates/mclone-audio" }
mclone-assets = { path = "crates/mclone-assets" }
mclone-app-runtime = { path = "crates/mclone-app-runtime" }
mclone-blocks = { path = "crates/mclone-blocks" }
mclone-client = { path = "crates/mclone-client" }
mclone-core = { path = "crates/mclone-core" }
mclone-diagnostics = { path = "crates/mclone-diagnostics" }
mclone-input = { path = "crates/mclone-input" }
mclone-light = { path = "crates/mclone-light" }
mclone-mesh = { path = "crates/mclone-mesh" }
mclone-net = { path = "crates/mclone-net" }
mclone-path = { path = "crates/mclone-path" }
mclone-physics = { path = "crates/mclone-physics" }
mclone-protocol = { path = "crates/mclone-protocol" }
mclone-render = { path = "crates/mclone-render" }
mclone-render-session = { path = "crates/mclone-render-session" }
mclone-server = { path = "crates/mclone-server" }
mclone-ui = { path = "crates/mclone-ui" }
mclone-worldgen = { path = "crates/mclone-worldgen" }
mclone-xr-graphics = { path = "crates/mclone-xr-graphics" }
mclone-xr-host = { path = "crates/mclone-xr-host" }
mclone-xr-scene = { path = "crates/mclone-xr-scene" }
metal = "0.31"
pollster = "0.4"
openxr = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
rusqlite = { version = "0.32", features = ["bundled"] }
tungstenite = "0.28"
wasm-bindgen = "0.2.125"
wasm-bindgen-futures = "0.4.75"
web-sys = "0.3.102"
wgpu = { version = "25", features = ["metal", "vulkan", "vulkan-portability"] }
winit = { version = "0.30", features = ["android-native-activity"] }

[patch.crates-io]
wgpu-hal = { path = "vendor/wgpu-hal-25.0.2" }

# Keep native debug runs useful for movement/render/worldgen performance work.
# This mirrors the Playbox policy in ~/code/playbox/Cargo.toml: optimize dev
# builds enough that `cargo run` and pnpm native smokes are not dominated by
# unoptimized physics/render/worldgen hot loops, while preserving debug
# assertions and incremental rebuild behavior.
[profile.dev]
opt-level = 2
