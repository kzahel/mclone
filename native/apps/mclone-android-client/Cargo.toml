[package]
name = "mclone-android-client"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
perf-diagnostics = ["mclone-app-runtime/perf-diagnostics"]

[target.'cfg(target_os = "android")'.dependencies]
anyhow.workspace = true
glam.workspace = true
jni.workspace = true
log.workspace = true
mclone-audio.workspace = true
mclone-android-platform.workspace = true
mclone-app-runtime.workspace = true
mclone-assets.workspace = true
mclone-client.workspace = true
mclone-core.workspace = true
mclone-diagnostics.workspace = true
mclone-input.workspace = true
mclone-render.workspace = true
mclone-render-session.workspace = true
mclone-scene.workspace = true
mclone-ui.workspace = true
pollster.workspace = true
serde_json.workspace = true
wgpu.workspace = true
winit.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
name = "mclone_android_client"
path = "src/lib.rs"
