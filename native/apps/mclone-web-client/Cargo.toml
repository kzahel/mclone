[package]
name = "mclone-web-client"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
perf-diagnostics = ["mclone-app-runtime/perf-diagnostics"]

[dependencies]
anyhow.workspace = true
glam.workspace = true
mclone-assets.workspace = true
mclone-app-runtime.workspace = true
mclone-audio.workspace = true
mclone-client.workspace = true
mclone-core.workspace = true
mclone-input.workspace = true
mclone-mesh.workspace = true
mclone-net.workspace = true
mclone-protocol.workspace = true
mclone-render.workspace = true
mclone-render-session.workspace = true
mclone-scene.workspace = true
mclone-server.workspace = true
mclone-terrain-view.workspace = true
mclone-ui.workspace = true
js-sys.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
wgpu.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { workspace = true, features = [
  "BinaryType",
  "console",
  "ErrorEvent",
  "Event",
  "Gamepad",
  "GamepadButton",
  "GamepadMappingType",
  "HtmlCanvasElement",
  "MessageEvent",
  "Navigator",
  "Performance",
  "Storage",
  "UrlSearchParams",
  "WebSocket",
  "Worker",
  "WorkerOptions",
  "WorkerType",
  "Window",
] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
name = "mclone_web_client"
path = "src/lib.rs"
