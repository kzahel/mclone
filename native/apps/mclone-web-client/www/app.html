<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>mclone native web</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #080a0d;
        color: #e7edf3;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
        background: #080a0d;
      }

      main {
        display: grid;
        grid-template-rows: minmax(0, 1fr) auto;
        min-height: 100vh;
      }

      .viewport {
        position: relative;
        min-height: 0;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
        background: #050607;
      }

      .hud {
        position: absolute;
        top: 16px;
        left: 16px;
        display: grid;
        gap: 8px;
        min-width: 220px;
        padding: 12px;
        border: 1px solid rgba(184, 198, 214, 0.22);
        border-radius: 8px;
        background: rgba(9, 13, 18, 0.84);
        backdrop-filter: blur(10px);
      }

      .hud h1 {
        margin: 0;
        font-size: 14px;
        line-height: 1.2;
        font-weight: 700;
      }

      .stats {
        display: grid;
        grid-template-columns: auto auto;
        gap: 4px 14px;
        font: 12px/1.35 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }

      .stats dt {
        color: #9aa8b6;
      }

      .stats dd {
        margin: 0;
        text-align: right;
      }

      .crosshair {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 18px;
        height: 18px;
        transform: translate(-50%, -50%);
        opacity: 0.72;
        pointer-events: none;
      }

      .crosshair::before,
      .crosshair::after {
        content: "";
        position: absolute;
        background: rgba(238, 244, 250, 0.86);
      }

      .crosshair::before {
        left: 8px;
        top: 1px;
        width: 2px;
        height: 16px;
      }

      .crosshair::after {
        left: 1px;
        top: 8px;
        width: 16px;
        height: 2px;
      }

      .status {
        min-height: 34px;
        padding: 10px 16px;
        border-top: 1px solid #202a35;
        background: #0d1218;
        font: 12px/1.35 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        color: #aeb9c5;
      }

      .status[data-ok="false"] {
        color: #ffb4b4;
      }

      @media (max-width: 680px) {
        .hud {
          top: 10px;
          left: 10px;
          min-width: 190px;
          padding: 10px;
        }

        .stats {
          grid-template-columns: auto;
        }

        .stats dd {
          text-align: left;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="viewport">
        <canvas id="mclone-canvas" width="960" height="540" tabindex="0"></canvas>
        <div class="crosshair" aria-hidden="true"></div>
        <aside class="hud" aria-label="Runtime status">
          <h1>mclone native web</h1>
          <dl class="stats">
            <dt>center</dt><dd id="center">0, 0</dd>
            <dt>camera</dt><dd id="camera">0, 0, 0</dd>
            <dt>mode</dt><dd id="mode">WALK</dd>
            <dt>ground</dt><dd id="ground">air</dd>
            <dt>chunks</dt><dd id="chunks">0</dd>
            <dt>sections</dt><dd id="sections">0</dd>
            <dt>time</dt><dd id="time">0 / 0.000</dd>
            <dt>actors</dt><dd id="actors">0/0</dd>
            <dt>pending</dt><dd id="pending">0</dd>
            <dt>frames</dt><dd id="frames">0</dd>
            <dt>lock</dt><dd id="lock">off</dd>
          </dl>
        </aside>
      </section>
      <div id="status" class="status" data-ok="true">booting</div>
    </main>
    <script type="module" src="./mclone-web-app.js"></script>
  </body>
</html>
