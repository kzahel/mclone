<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>mclone native web</title>
    <style>
      :root {
        color-scheme: dark;
        background: #080a0d;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
        background: #080a0d;
      }

      main,
      .viewport {
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        min-height: 100vh;
      }

      .viewport {
        position: relative;
        overflow: hidden;
        touch-action: none;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
        background: #050607;
        touch-action: none;
        user-select: none;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="viewport">
        <canvas id="mclone-canvas" width="960" height="540" tabindex="0"></canvas>
      </section>
    </main>
    <script>
      globalThis["__MCLONE_NATIVE_WEB_ASSET" + "_VERSION__"] = "__MCLONE_NATIVE_WEB_ASSET_VERSION__";
    </script>
    <script type="module" src="./mclone-web-app.js?v=__MCLONE_NATIVE_WEB_ASSET_VERSION__"></script>
  </body>
</html>
