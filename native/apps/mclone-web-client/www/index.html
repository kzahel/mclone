<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>mclone native web smoke</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        background: #0b0d10;
        color: #d8e0e7;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      main {
        width: min(920px, calc(100vw - 32px));
      }

      h1 {
        margin: 0 0 16px;
        font-size: 18px;
        font-weight: 600;
      }

      canvas {
        display: block;
        width: 100%;
        height: auto;
        aspect-ratio: 16 / 9;
        margin: 0 0 16px;
        border: 1px solid #2b333c;
        border-radius: 6px;
        background: #050607;
      }

      pre {
        margin: 0;
        padding: 16px;
        overflow: auto;
        border: 1px solid #2b333c;
        border-radius: 6px;
        background: #11161c;
        line-height: 1.45;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>mclone native web smoke</h1>
      <canvas id="mclone-canvas" width="640" height="360"></canvas>
      <pre id="status">booting</pre>
    </main>
    <script type="module" src="./mclone-web-smoke.js"></script>
  </body>
</html>
