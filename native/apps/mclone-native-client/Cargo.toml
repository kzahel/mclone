[package]
name = "mclone-native-client"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
perf-diagnostics = ["mclone-app-runtime/perf-diagnostics"]
physics-rapier = ["mclone-server/physics-rapier"]
physics-box3d = ["mclone-server/physics-box3d"]
xr = [
    "dep:libloading",
    "dep:metal",
    "dep:mclone-xr-graphics",
    "dep:mclone-xr-host",
    "dep:mclone-xr-scene",
    "dep:openxr",
    "dep:pollster",
]

[dependencies]
anyhow.workspace = true
env_logger.workspace = true
glam.workspace = true
image.workspace = true
libc.workspace = true
libloading = { workspace = true, optional = true }
log.workspace = true
mclone-audio.workspace = true
mclone-assets.workspace = true
mclone-app-runtime.workspace = true
mclone-client.workspace = true
mclone-core.workspace = true
mclone-diagnostics.workspace = true
mclone-frame-budget.workspace = true
mclone-input.workspace = true
mclone-mesh.workspace = true
mclone-net.workspace = true
mclone-protocol.workspace = true
mclone-render.workspace = true
mclone-render-session.workspace = true
mclone-server.workspace = true
mclone-ui.workspace = true
mclone-xr-graphics = { workspace = true, optional = true }
mclone-xr-host = { workspace = true, optional = true }
mclone-xr-scene = { workspace = true, optional = true }
openxr = { workspace = true, optional = true }
pollster = { workspace = true, optional = true }
serde_json.workspace = true
wgpu.workspace = true
winit.workspace = true

[target.'cfg(target_vendor = "apple")'.dependencies]
metal = { workspace = true, optional = true }

[[bin]]
name = "mclone-native-client"
path = "src/main.rs"

[[bin]]
name = "mesh_cpu_perf"
path = "src/bin/mesh_cpu_perf.rs"
