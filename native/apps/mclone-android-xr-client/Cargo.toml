[package]
name = "mclone-android-xr-client"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
perf-diagnostics = ["mclone-app-runtime/perf-diagnostics"]

[target.'cfg(target_os = "android")'.dependencies]
android-activity.workspace = true
anyhow.workspace = true
jni.workspace = true
libc.workspace = true
log.workspace = true
mclone-assets.workspace = true
mclone-audio.workspace = true
mclone-android-platform.workspace = true
mclone-app-runtime.workspace = true
mclone-client.workspace = true
mclone-diagnostics.workspace = true
mclone-input.workspace = true
mclone-protocol.workspace = true
mclone-render.workspace = true
mclone-render-session.workspace = true
mclone-season.workspace = true
mclone-xr-graphics.workspace = true
mclone-xr-host.workspace = true
mclone-scene.workspace = true
mclone-ui.workspace = true
openxr.workspace = true
serde_json.workspace = true
wgpu.workspace = true
winit.workspace = true

[dev-dependencies]
mclone-app-runtime.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
name = "mclone_android_xr_client"
path = "src/lib.rs"
