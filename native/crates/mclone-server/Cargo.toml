[package]
name = "mclone-server"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
mclone-core.workspace = true
mclone-blocks.workspace = true
mclone-frame-budget.workspace = true
mclone-light.workspace = true
mclone-path.workspace = true
mclone-physics = { workspace = true, optional = true }
mclone-protocol.workspace = true
mclone-worldgen.workspace = true
serde.workspace = true
uuid.workspace = true

[features]
default = []
perf-diagnostics = ["mclone-light/perf-diagnostics"]
physics = ["dep:mclone-physics"]
# Umbrella marker: "a physics engine backend is compiled into the server runtime".
# Enabled by whichever concrete engine feature is selected; never selected alone.
physics-engine = ["physics"]
physics-rapier = ["physics-engine", "mclone-physics/rapier"]
physics-box3d = ["physics-engine", "mclone-physics/box3d"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys.workspace = true
wasm-bindgen.workspace = true
web-sys = { workspace = true, features = [
  "ErrorEvent",
  "MessageEvent",
  "Worker",
  "WorkerOptions",
  "WorkerType",
] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rusqlite.workspace = true
serde_json.workspace = true

[dev-dependencies]
serde_json.workspace = true

[lib]
name = "mclone_server"
path = "src/lib.rs"
