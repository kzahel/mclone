[package]
name = "mclone-render"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
# Window/surface ownership is platform glue. Shared render consumers, including
# `mclone-scene`, intentionally leave this disabled so they do not acquire a
# transitive winit dependency (tactical 168 host-purity guardrail).
native-surface = ["dep:winit"]

[dependencies]
anyhow.workspace = true
glam.workspace = true
image.workspace = true
log.workspace = true
mclone-assets.workspace = true
mclone-core.workspace = true
mclone-diagnostics.workspace = true
mclone-mesh.workspace = true
mclone-render-color.workspace = true
mclone-ui.workspace = true
rustc-hash = "1"
serde.workspace = true
serde_json.workspace = true
wgpu.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster.workspace = true
winit = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys.workspace = true

[dev-dependencies]
naga.workspace = true

[lib]
name = "mclone_render"
path = "src/lib.rs"
