name: Development builds
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a dated experimental prerelease
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: development-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}
env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: '3'
jobs:
  checks-and-assets:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: checks-${{ runner.os }}-${{ hashFiles('native/Cargo.lock', 'rust-toolchain.toml') }}-v1
      - name: Formatting and architecture boundaries
        run: |
          cargo fmt --manifest-path native/Cargo.toml --all --check
          pnpm native:thin-adapters:purity
          pnpm native:scene-host:purity
          pnpm native:xr:frame-driver:purity
      - name: Build original assets from tracked inputs
        run: |
          test ! -e reference/minecraft-1.17.1/extracted.zip
          pnpm --dir tools/texture-lab install --frozen-lockfile
          pnpm assets:pack:first-party:test
          pnpm assets:pack:first-party
          pnpm --silent assets:validate:first-party > /tmp/first-party-provenance.json
          python3 scripts/test-public-assets.py
          python3 scripts/check-public-assets.py generated-assets/first-party-stage
          git diff --exit-code -- native/Cargo.lock pnpm-lock.yaml tools/*/pnpm-lock.yaml
      - name: Shared correctness tests
        run: |
          cargo test --locked --manifest-path native/Cargo.toml --lib -p mclone-assets -p mclone-app-runtime -p mclone-client -p mclone-server -p mclone-worldgen -p mclone-input -p mclone-ui -p mclone-net -p mclone-protocol -p mclone-xr-host
      - name: Scan history for secrets
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/check-secrets.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: first-party-packs
          path: generated-assets/first-party-stage/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: first-party-provenance
          path: /tmp/first-party-provenance.json
          if-no-files-found: error
          retention-days: 7
  packages:
    needs: checks-and-assets
    uses: ./.github/workflows/packages.yml
    secrets: inherit
  publish:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.publish)
    needs: [checks-and-assets, packages]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: package-*
          path: release-downloads
          merge-multiple: true
      - name: Publish complete dated nightly
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish-nightly.py release-downloads
