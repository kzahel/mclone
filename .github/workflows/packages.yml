name: Package clients
on:
  workflow_call:
permissions:
  contents: read
env:
  MCLONE_USE_STAGED_ASSETS: '1'
  CARGO_BUILD_JOBS: '3'
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
          - runner: windows-2025
            platform: windows-x64
          - runner: macos-15
            platform: macos-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: first-party-packs
          path: generated-assets/first-party-stage
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: desktop-${{ matrix.platform }}-${{ hashFiles('native/Cargo.lock', 'rust-toolchain.toml') }}-v1
      - name: Build desktop with OpenXR
        shell: bash
        run: cargo build --locked --release --manifest-path native/Cargo.toml -p mclone-native-client --bin mclone-native-client --features xr
      - name: Bundle executable, resources and notices
        shell: bash
        run: python scripts/package-desktop.py --platform '${{ matrix.platform }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-${{ matrix.platform }}
          path: |
            dist-release/*.zip
            dist-release/*.sha256
          if-no-files-found: error
          retention-days: 7
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: first-party-packs
          path: generated-assets/first-party-stage
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: web-${{ runner.os }}-${{ hashFiles('native/Cargo.lock', 'rust-toolchain.toml') }}-v1
      - name: Prepare thumbnail browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Bundle game and development hub without reference inputs
        env:
          PLAYWRIGHT_CHROME_CHANNEL: chromium
        run: |
          pnpm native:web:bundle
          pnpm exec tsc --noEmit -p native/apps/mclone-web-client/tsconfig.json
          mkdir -p dist-release
          cd dist-native-web
          zip -qr ../dist-release/mclone-web.zip .
          cd ../dist-release
          sha256sum mclone-web.zip > mclone-web.zip.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-web
          path: dist-release/*
          if-no-files-found: error
          retention-days: 7
  android:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: first-party-packs
          path: generated-assets/first-party-stage
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.gradle/caches
            ~/.gradle/wrapper
            native/target
          key: android-${{ runner.os }}-${{ hashFiles('native/Cargo.lock', 'rust-toolchain.toml', '**/build.gradle.kts') }}-v1
      - name: Provision the pinned Android lane
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.0.12077973'
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --version 4.1.2 --locked
      - name: Prepare stable nightly signer
        env:
          KEYSTORE_BASE64: ${{ secrets.MCLONE_ANDROID_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          value = os.environ['KEYSTORE_BASE64']
          if not value:
              raise SystemExit('The nightly signing key must be configured before distribution builds')
          key = Path(os.environ['RUNNER_TEMP']) / 'nightly.p12'
          key.write_bytes(base64.b64decode(value, validate=True))
          key.chmod(0o600)
          with open(os.environ['GITHUB_ENV'], 'a') as out:
              out.write(f'MCLONE_ANDROID_KEYSTORE={key}\n')
          PY
      - name: Build flat Android and Quest APKs
        env:
          MCLONE_ANDROID_STORE_PASSWORD: ${{ secrets.MCLONE_ANDROID_STORE_PASSWORD }}
          MCLONE_ANDROID_VERSION_CODE: ${{ github.run_number }}
          MCLONE_ANDROID_VERSION_NAME: nightly-${{ github.run_number }}
        run: |
          pnpm native:android:apk --release
          pnpm native:android-xr:apk
          python3 scripts/package-android.py
      - name: Remove temporary signer
        if: always()
        run: rm -f "$RUNNER_TEMP/nightly.p12"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-android
          path: dist-release/*
          if-no-files-found: error
          retention-days: 7
